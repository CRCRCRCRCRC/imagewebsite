<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260328a" />
  </head>
  <body>
    <button
      class="view-controls-button"
      id="toggleViewControls"
      type="button"
      aria-label="調整檢視"
      aria-controls="viewControlsPanel"
      aria-expanded="false"
    >
      <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
        <path d="M5 7h14" />
        <path d="M5 12h14" />
        <path d="M5 17h14" />
        <circle cx="9" cy="7" r="2" />
        <circle cx="15" cy="12" r="2" />
        <circle cx="11" cy="17" r="2" />
      </svg>
    </button>

    <section class="view-controls-panel" id="viewControlsPanel" aria-hidden="true">
      <div class="view-controls-group">
        <div class="view-controls-head">
          <span>圖片高度</span>
          <strong id="galleryHeightValue">320px</strong>
        </div>
        <input
          id="galleryHeightInput"
          class="view-controls-range"
          type="range"
          min="180"
          max="520"
          step="10"
          value="320"
        />
      </div>

      <div class="view-controls-group">
        <div class="view-controls-head">
          <span>網站縮放</span>
          <strong id="siteScaleValue">100%</strong>
        </div>
        <input
          id="siteScaleInput"
          class="view-controls-range"
          type="range"
          min="70"
          max="140"
          step="5"
          value="100"
        />
      </div>

      <button class="view-controls-reset" id="resetViewControls" type="button">重設</button>
    </section>

    <main class="desktop-shell">
      <section class="workspace-stack">
        <section class="workspace-row">
          <section class="gallery-stage" id="galleryStage" hidden>
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="empty-state" id="emptyState" hidden></div>
          </section>

          <aside class="sidebar-tools">
            <section class="desktop-grid" aria-label="操作">
              <button class="desktop-action desktop-action-primary" id="uploadTrigger" type="button">
                <span class="icon-surface" aria-hidden="true">
                  <svg viewBox="0 0 120 120" class="line-icon upload-icon">
                    <path d="M30 81H24c-9 0-16-7-16-16 0-9 7-16 16-16h4c3-15 17-26 33-26 13 0 25 7 31 18h5c10 0 18 8 18 18s-8 18-18 18h-7" />
                    <path d="M40 54v31h40V54" />
                    <path d="M50 45l10-11 10 11" />
                    <path d="M60 34v33" />
                    <path d="M34 85v13h52V85" />
                  </svg>
                </span>
                <strong>上傳圖片</strong>
              </button>

              <button class="desktop-action desktop-action-primary" id="openFolderModal" type="button">
                <span class="icon-surface" aria-hidden="true">
                  <svg viewBox="0 0 120 120" class="line-icon folder-icon">
                    <path d="M16 42c0-6 5-11 11-11h22l9 10h35c6 0 11 5 11 11v33c0 8-6 14-14 14H30c-8 0-14-6-14-14V42z" />
                    <path d="M16 49h88" />
                  </svg>
                </span>
                <strong>新增資料夾</strong>
              </button>
            </section>
          </aside>
        </section>

        <section class="folder-strip" id="folderList" aria-label="資料夾" hidden></section>
      </section>

      <input id="fileInput" type="file" accept="image/*" multiple hidden />

      <div class="modal-backdrop" id="uploadModal" aria-hidden="true">
        <section class="modal-card upload-modal-card" role="dialog" aria-modal="true" aria-label="上傳圖片">
          <div class="upload-modal-copy">
            <p class="upload-modal-title">上傳圖片</p>
            <p class="upload-modal-subtitle">貼上、拖曳，或從本機一次選多張。</p>
          </div>

          <div class="upload-dropzone" id="uploadDropzone" tabindex="0" role="button" aria-label="拖曳或貼上圖片到這裡">
            <span class="upload-dropzone-icon" aria-hidden="true">
              <svg viewBox="0 0 120 120" class="line-icon upload-icon">
                <path d="M30 81H24c-9 0-16-7-16-16 0-9 7-16 16-16h4c3-15 17-26 33-26 13 0 25 7 31 18h5c10 0 18 8 18 18s-8 18-18 18h-7" />
                <path d="M40 54v31h40V54" />
                <path d="M50 45l10-11 10 11" />
                <path d="M60 34v33" />
                <path d="M34 85v13h52V85" />
              </svg>
            </span>
            <strong>把圖片拖到這裡</strong>
            <span>也可以直接貼上圖片</span>
          </div>

          <div class="upload-queue" id="uploadQueue" hidden></div>

          <div class="modal-actions upload-modal-actions">
            <button type="button" class="ghost-button upload-text-button" id="closeUploadModal">取消</button>
            <button type="button" class="ghost-button upload-text-button" id="chooseUploadFiles">從本機選擇</button>
            <button type="button" class="solid-button upload-text-button" id="submitUploadQueue">開始上傳</button>
          </div>
        </section>
      </div>

      <div class="sr-only" aria-live="polite">
        <span id="statusMessage"></span>
        <span id="currentFolderName"></span>
        <span id="folderCount"></span>
        <span id="imageCount"></span>
        <span id="galleryCount"></span>
      </div>
    </main>

    <div class="modal-backdrop" id="folderModal" aria-hidden="true">
      <section class="modal-card" role="dialog" aria-modal="true" aria-label="新增資料夾">
        <form id="folderForm" class="folder-form" novalidate>
          <label class="sr-only" for="folderNameInput">資料夾名稱</label>

          <div class="folder-input-shell">
            <span class="modal-folder-icon" aria-hidden="true">
              <svg viewBox="0 0 120 120" class="line-icon folder-icon">
                <path d="M16 41c0-6 5-11 11-11h22l8 10h36c6 0 11 5 11 11v34c0 8-6 14-14 14H30c-8 0-14-6-14-14V41z" />
                <path d="M16 48h88" />
              </svg>
            </span>
            <input id="folderNameInput" name="folderName" type="text" maxlength="40" autocomplete="off" required />
          </div>

          <div class="modal-actions">
            <button type="button" class="ghost-button" id="closeFolderModal" aria-label="取消">
              <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
                <path d="M6 6l12 12" />
                <path d="M18 6L6 18" />
              </svg>
            </button>
            <button type="submit" class="solid-button" id="submitFolderForm" aria-label="建立資料夾">
              <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
                <path d="M5 13l4 4L19 7" />
              </svg>
            </button>
          </div>
        </form>
      </section>
    </div>

    <div class="image-viewer" id="imageViewer" aria-hidden="true">
      <section class="image-viewer-shell" role="dialog" aria-modal="true" aria-label="圖片預覽">
        <div class="image-viewer-toolbar">
          <button type="button" class="viewer-icon-button" id="editPreview" aria-label="編輯圖片">
            <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
              <path d="M4 20h4l10-10-4-4L4 16v4" />
              <path d="M13 7l4 4" />
              <path d="M15 4l5 5" />
            </svg>
          </button>
          <button type="button" class="viewer-icon-button" id="renamePreview" aria-label="重新命名圖片">
            <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
              <path d="M4 20h4l10-10-4-4L4 16v4" />
              <path d="M13 7l4 4" />
            </svg>
          </button>
          <button type="button" class="viewer-icon-button" id="downloadPreview" aria-label="下載圖片">
            <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
              <path d="M12 4v10" />
              <path d="M8 10l4 4 4-4" />
              <path d="M5 18h14" />
            </svg>
          </button>
          <button type="button" class="viewer-icon-button" id="copyPreview" aria-label="複製圖片">
            <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
              <rect x="9" y="9" width="10" height="10" rx="2" />
              <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <button type="button" class="viewer-icon-button viewer-icon-button-danger" id="deletePreview" aria-label="刪除圖片">
            <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
              <path d="M4 7h16" />
              <path d="M10 11v6" />
              <path d="M14 11v6" />
              <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
              <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
            </svg>
          </button>
          <button type="button" class="viewer-icon-button" id="closePreview" aria-label="關閉預覽">
            <svg viewBox="0 0 24 24" class="mini-icon" aria-hidden="true">
              <path d="M6 6l12 12" />
              <path d="M18 6L6 18" />
            </svg>
          </button>
        </div>

        <p class="image-viewer-name" id="previewName"></p>
        <img id="previewImage" alt="" />
      </section>
    </div>

    <div class="image-editor" id="imageEditor" aria-hidden="true">
      <section class="image-editor-shell" role="dialog" aria-modal="true" aria-label="編輯圖片">
        <div class="image-editor-stage-shell">
          <div class="image-editor-stage-head">
            <div>
              <p class="image-editor-title">編輯圖片</p>
              <p class="image-editor-hint" id="editorHint">裁切、畫筆、橡皮擦、旋轉都在右邊。</p>
            </div>
          </div>

          <div class="image-editor-stage" id="editorStage">
            <canvas id="editorCanvas" tabindex="0"></canvas>
          </div>
        </div>

        <aside class="image-editor-panel">
          <section class="image-editor-group">
            <p class="image-editor-label">工具</p>
            <div class="image-editor-tool-grid">
              <button type="button" class="editor-tool active" id="editorCropTool">裁切</button>
              <button type="button" class="editor-tool" id="editorDrawTool">畫筆</button>
              <button type="button" class="editor-tool" id="editorEraserTool">橡皮擦</button>
              <button type="button" class="editor-tool" id="applyCropTool">套用裁切</button>
            </div>
          </section>

          <section class="image-editor-group">
            <p class="image-editor-label">調整</p>
            <div class="image-editor-tool-grid image-editor-tool-grid-compact">
              <button type="button" class="editor-tool" id="editorUndo">上一步</button>
              <button type="button" class="editor-tool" id="editorRedo">下一步</button>
              <button type="button" class="editor-tool" id="editorRotateLeft">向左轉</button>
              <button type="button" class="editor-tool" id="editorRotateRight">向右轉</button>
              <button type="button" class="editor-tool" id="resetEditor">重設</button>
            </div>
          </section>

          <section class="image-editor-group">
            <p class="image-editor-label">畫筆</p>
            <div class="image-editor-controls">
              <label class="editor-control">
                <span>顏色</span>
                <input type="color" id="editorColor" value="#0f1a2b" />
              </label>
              <label class="editor-control editor-control-range">
                <span>粗細</span>
                <input type="range" id="editorBrushSize" min="2" max="32" value="8" />
              </label>
            </div>
          </section>

          <div class="image-editor-actions">
            <button type="button" class="ghost-button upload-text-button" id="closeEditor">取消</button>
            <button type="button" class="solid-button upload-text-button" id="saveEditor">儲存</button>
          </div>
        </aside>
      </section>
    </div>

    <script type="module" src="./app.js?v=20260328a"></script>
  </body>
</html>
